<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>İzin Yönetimi</title>
    <script>
      // The ThemeProvider keeps this in sync after mount; this runs before the first paint so a
      // stored or OS dark preference never flashes the light theme (spec 0007 AC-3).
      ;(() => {
        try {
          const stored = localStorage.getItem('leave-manager.theme')
          // Anything except `light` follows the OS, matching detectInitialTheme (spec 0007 F-6).
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch {
          // Blocked storage: fall back to the OS preference, like the provider (F-5).
          try {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark')
            }
          } catch {
            // No matchMedia: the light default is the safe fallback.
          }
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
