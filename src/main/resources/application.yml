spring:
  application:
    name: leave-manager
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/leave_manager}
    username: ${DB_USER:leave}
    password: ${DB_PASSWORD:leave}
    hikari:
      # The health check must answer within 2 seconds even when the database is unreachable.
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      # The session tables are a Flyway migration (V2), not startup DDL.
      initialize-schema: never

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      # The contract is GET /api/health (docs/architecture.md, single origin).
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      # The contract body is exactly {"status":"UP"} / {"status":"DOWN"}; the liveness/readiness
      # probe groups would add a "groups" field to the response.
      probes:
        enabled: false
      show-details: never

app:
  identity:
    max-failed-attempts: 5
    lockout-duration: 15m
    session-max-age: 8h
  seed:
    hr-email: ${SEED_HR_EMAIL:}
    hr-password: ${SEED_HR_PASSWORD:}
    ceo-email: ${SEED_CEO_EMAIL:}
    ceo-password: ${SEED_CEO_PASSWORD:}
