# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md, Two speeds, one contract).
#
# Format: <name>: <command> — one step per line, run in order, fail fast.
#   [fast] in the name = part of ./scripts/check --fast (the inner loop); untagged = full profile only.
#   requires <step>: <command> — what a step needs of the machine; exit 0 = met, an unmet one fails
#   check before any step runs (environment gap, R-13).
#   Split a test step by a selector (Surefire *Test / Failsafe *IT), never by a list.

# --- frontend first: the jar packages web/dist (single-origin deployment, ADR 0002) ---
web-deps [fast]: npm --prefix web ci --no-audit --no-fund
web-build [fast]: npm --prefix web run build
web-lint [fast]: npm --prefix web run lint
web-test [fast]: npm --prefix web run test

# --- backend: Maven, no build daemon (resource hygiene rule 1) ---
build [fast]: ./mvnw -q -DskipTests package
test [fast]: ./mvnw -q test
test-integration: ./mvnw -q verify -DskipUnitTests=true

# --- end to end: the journeys named in docs/testing.md, one worker, headless; scripts/e2e owns the app lifecycle ---
e2e: ./scripts/e2e

# --- prerequisites ---
requires web-deps: node --version
requires build: java -version
requires test-integration: docker info
requires e2e: docker info
