# scripts/check.conf — the steps behind ./scripts/check (docs/testing.md, Two speeds, one contract).
#
# GREENFIELD: no application code exists yet (invariant rule 1 — no spec, no code). The walking
# skeleton (spec 0001) creates the toolchain and uncomments these lines. Until then ./scripts/check
# is a no-op and ./scripts/residue reports RESIDUE NOT MEASURED — neither is evidence of anything.
#
# Format: <name>: <command> — one step per line, run in order, fail fast.
#   [fast] in the name = part of ./scripts/check --fast (the inner loop); untagged = full profile only.
#   requires <step>: <command> — what a step needs of the machine; exit 0 = met, unmet fails check
#   before any step runs (environment gap, R-13).
#   Split a test step by a selector (Surefire *Test / Failsafe *IT / Vitest project), never by a list
#   (docs/testing.md, Two speeds rule 4).

# --- backend: Maven, no build daemon (resource hygiene rule 1) ---
# build [fast]: ./mvnw -q -DskipTests package
# test [fast]: ./mvnw -q test
# test-integration: ./mvnw -q verify -DskipUnitTests        # skipUnitTests = Surefire skip property, defined in pom.xml

# --- frontend: Vite build, run-once tests, no watcher (resource hygiene rule 4) ---
# web-build [fast]: npm --prefix web run build
# web-lint [fast]: npm --prefix web run lint
# web-test [fast]: npm --prefix web run test -- --run

# --- end to end: exactly one journey, one worker, headless; Playwright owns the app lifecycle ---
# e2e: npm --prefix web run e2e

# --- prerequisites: uncomment together with the steps that need them ---
# requires build: java -version
# requires test-integration: docker info
# requires web-build: node --version
# requires e2e: docker info
