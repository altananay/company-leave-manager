name: check
on:
  push:
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # doctor diffs specs/done/ against the PR's merge-base; a shallow clone has no base
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict
      - name: Self-test (scripts/check, doctor and residue behave as documented)
        run: ./scripts/selftest

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Playwright browser (from the pinned package)
        working-directory: web
        run: npx playwright install --with-deps chromium
      # --fast is for the inner loop only; CI always runs the full contract (docs/testing.md).
      - name: Verification contract
        run: ./scripts/check
