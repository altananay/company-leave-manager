services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: leave_manager
      POSTGRES_USER: leave
      POSTGRES_PASSWORD: leave
    ports:
      # 5432 is taken by a local PostgreSQL on the development machine; the project's database lives on 5433.
      - '${DB_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U leave -d leave_manager']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      # postgres:18 wants a single mount at /var/lib/postgresql (data lives in a versioned subdirectory).
      - db-data:/var/lib/postgresql

volumes:
  db-data:
