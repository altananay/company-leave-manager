services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-leave_manager}
      POSTGRES_USER: ${DB_USER:-leave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leave}
    ports:
      # 5432 is a local PostgreSQL, 5433 another project's container; 5434 is this project's default.
      # Override with DB_HOST_PORT in .env, or use DB_HOST_PORT=0 for a random free port.
      # e2e always publishes on a random free host port (DB_HOST_PORT=0) and discovers it.
      - '127.0.0.1:${DB_HOST_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-leave} -d ${DB_NAME:-leave_manager}']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      # postgres:18 wants a single mount at /var/lib/postgresql (data lives in a versioned subdirectory).
      - db-data:/var/lib/postgresql

  # --- optional logging stack (spec 0006): `docker compose --profile logging up -d` ---
  # The default `docker compose up -d db` never starts any of these (the profile gates them all).
  app:
    profiles: ['logging']
    image: eclipse-temurin:25-jre
    container_name: leave-manager-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-leave_manager}
      DB_USER: ${DB_USER:-leave}
      DB_PASSWORD: ${DB_PASSWORD:-leave}
      PORT: '8080'
      SEED_HR_EMAIL: ${SEED_HR_EMAIL:-}
      SEED_HR_PASSWORD: ${SEED_HR_PASSWORD:-}
      SEED_CEO_EMAIL: ${SEED_CEO_EMAIL:-}
      SEED_CEO_PASSWORD: ${SEED_CEO_PASSWORD:-}
    command: ['sh', '-c', 'exec java -jar /app/leave-manager-*.jar']
    ports:
      - '127.0.0.1:${APP_HOST_PORT:-8085}:8080'
    volumes:
      # Build the jar first: ./mvnw -q -DskipUnitTests=true package
      - ./target:/app:ro
    # The filestream input reads <id>-json.log; pin the driver the daemon may otherwise change.
    logging:
      driver: json-file

  elasticsearch:
    profiles: ['logging']
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60

  kibana:
    profiles: ['logging']
    image: docker.elastic.co/kibana/kibana:9.5.5
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - '127.0.0.1:5601:5601'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5601/api/status || exit 1']
      interval: 5s
      timeout: 3s
      retries: 60

  kibana-setup:
    profiles: ['logging']
    image: docker.elastic.co/kibana/kibana:9.5.5
    depends_on:
      kibana:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        curl -fsS -X POST http://kibana:5601/api/data_views/data_view
        -H 'kbn-xsrf: true' -H 'Content-Type: application/json'
        -d '{"data_view":{"title":"filebeat-*","name":"Filebeat"}}' || true
    restart: 'no'

  filebeat-setup:
    profiles: ['logging']
    image: docker.elastic.co/beats/filebeat:9.5.5
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ['filebeat', 'setup', '-e', '--strict.perms=false', '--index-management']
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./docker/filebeat/ilm-policy.json:/usr/share/filebeat/ilm-policy.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: 'no'

  filebeat:
    profiles: ['logging']
    image: docker.elastic.co/beats/filebeat:9.5.5
    user: root
    depends_on:
      filebeat-setup:
        condition: service_completed_successfully
    command: ['filebeat', '-e', '--strict.perms=false']
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./docker/filebeat/ilm-policy.json:/usr/share/filebeat/ilm-policy.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The filestream input reads the app container's json-file log; the docker input is gone in
      # Beats 9. Docker Desktop keeps this path inside its Linux VM, which the daemon can bind.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    restart: unless-stopped

volumes:
  db-data:
  es-data:
