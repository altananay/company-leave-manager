services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-leave_manager}
      POSTGRES_USER: ${DB_USER:-leave}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leave}
    ports:
      # 5432 is a local PostgreSQL, 5433 another project's container; 5434 is this project's default.
      # Override with DB_HOST_PORT in .env, or use DB_HOST_PORT=0 for a random free port.
      # e2e always publishes on a random free host port (DB_HOST_PORT=0) and discovers it.
      - '${DB_HOST_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-leave} -d ${DB_NAME:-leave_manager}']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      # postgres:18 wants a single mount at /var/lib/postgresql (data lives in a versioned subdirectory).
      - db-data:/var/lib/postgresql

volumes:
  db-data:
